<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smart_chair_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smart_chair_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: "SmartChairTimes";
      src: url("assets/assets/fonts/times.ttf") format("truetype"), local("Times New Roman");
      font-weight: 400;
      unicode-range: U+0000-00FF, U+2000-206F;
    }

    @font-face {
      font-family: "SmartChairTimes";
      src: url("assets/assets/fonts/timesbd.ttf") format("truetype"), local("Times New Roman Bold");
      font-weight: 700 900;
      unicode-range: U+0000-00FF, U+2000-206F;
    }

    @font-face {
      font-family: "SmartChairKai";
      src: url("assets/assets/fonts/kaiu.ttf") format("truetype"), local("DFKai-SB"), local("標楷體");
      font-weight: 100 900;
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+3100-312F,
        U+31A0-31BF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF,
        U+FF00-FFEF;
    }

    html, body, flt-glass-pane {
      font-family: "SmartChairTimes", "SmartChairKai", serif;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
