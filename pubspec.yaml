name: smart_chair_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SmartChairKai
      fonts:
        - asset: assets/fonts/kaiu.ttf
          weight: 100
        - asset: assets/fonts/kaiu.ttf
          weight: 200
        - asset: assets/fonts/kaiu.ttf
          weight: 300
        - asset: assets/fonts/kaiu.ttf
          weight: 400
        - asset: assets/fonts/kaiu.ttf
          weight: 500
        - asset: assets/fonts/kaiu.ttf
          weight: 600
        - asset: assets/fonts/kaiu.ttf
          weight: 700
        - asset: assets/fonts/kaiu.ttf
          weight: 800
        - asset: assets/fonts/kaiu.ttf
          weight: 900

