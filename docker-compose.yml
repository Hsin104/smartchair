services:
  db:
    image: postgres:16
    container_name: smartchair-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: smartchair
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  mqtt-broker:
    image: eclipse-mosquitto
    container_name: smartchair-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  django:
    build: .
    # tini 當 PID 1：healthcheck.py 連續失敗時才能 SIGKILL 卡住的主程式，讓 restart policy 重啟容器
    init: true
    container_name: smartchair-django
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
      DB_CONN_MAX_AGE: 60   # Gunicorn 每條 thread 重用 DB 連線，避免高併發時埠耗盡（見 settings.py）
      MCP_SERVER_HOST: mcp
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/root/smartchair_faiss
    # 正式 WSGI server（取代 runserver），worker／thread 數可在 .env 用 GUNICORN_WORKERS／GUNICORN_THREADS 調整
    command: gunicorn smartchair_backend.wsgi:application -c gunicorn.conf.py
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "http", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mqtt-subscriber:
    build: .
    # tini 當 PID 1：healthcheck.py 連續失敗時才能 SIGKILL 卡住的主程式，讓 restart policy 重啟容器
    init: true
    container_name: smartchair-mqtt-subscriber
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
    command: python manage.py mqtt_subscriber
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "mqtt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Physio Agent 非同步任務處理：App 透過 POST /api/agent/jobs 送出的任務在這裡以 async/await 處理，
  # 不佔用 django（Gunicorn）的執行緒。負載高時可直接多開：docker compose up -d --scale agent-worker=3
  agent-worker:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      - db
      - mcp
    env_file: .env
    environment:
      DB_HOST: db
      DB_CONN_MAX_AGE: 60
      MCP_SERVER_HOST: mcp
    command: python manage.py agent_worker
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp:
    build: .
    # tini 當 PID 1：healthcheck.py 連續失敗時才能 SIGKILL 卡住的主程式，讓 restart policy 重啟容器
    init: true
    container_name: smartchair-mcp
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8010:8010"
    volumes:
      - faiss_data:/root/smartchair_faiss
    command: python manage.py mcp_server
    healthcheck:
      # 用 HTTP 而非單純 TCP 連線：process 卡住時核心仍會完成 TCP 握手，TCP 檢查偵測不到
      test: ["CMD", "python", "healthcheck.py", "http", "http://localhost:8010/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # profiles 讓這個服務預設不會被 "docker compose up -d"（不指定服務名稱）啟動，
  # 避免每台機器（例如這台開發用 Windows）不小心一起搶同一個固定網域。
  # 真的要啟動時明確指定：docker compose up -d ngrok
  ngrok:
    image: ngrok/ngrok:latest
    container_name: smartchair-ngrok
    restart: unless-stopped
    profiles: ["ngrok"]
    depends_on:
      - django
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - --url=${NGROK_DOMAIN}
      - django:8000

volumes:
  db_data:
  mqtt_data:
  mqtt_log:
  faiss_data:
